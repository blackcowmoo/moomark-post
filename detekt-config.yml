---
build:
  maxIssues: 0

complexity:
  active: true
  TooManyFunctions:
    active: true
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - ArrayIndexOutOfBoundsException
      - Error
      - Exception
      - IllegalMonitorStateException
      - NullPointerException
      - RuntimeException
      - Throwable

performance:
  active: true
  SpreadOperator:
    active: false

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '100'
      - '1000'

  UnusedPrivateMember:
    active: true

  UseCheckOrError:
    active: true

  WildcardImport:
    active: true

  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true

  ReturnCount:
    active: true
    max: 2

potential-bugs:
  active: true

naming:
  active: true

comments:
  active: true
