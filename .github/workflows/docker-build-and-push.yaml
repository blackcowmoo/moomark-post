name: github-actions/docker/build-and-push
on:
  pull_request:
    branches:
      - develop
    types: [labeled, synchronize, opened]

  push:
    branches:
      - develop

env:
  REGISTRY: ${{ secrets.HARBOR_URL }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # deploy 라벨이 있거나, develop/main 브랜치인 경우에 실행
    if: contains(github.event.pull_request.labels.*.name, 'deploy') || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run build
        run: ./gradlew build -x checkstyleMain -x test -x checkstyleTest --stacktrace -Pprofile=production

      - name: Set docker registry (PR)
        if: contains(github.event.pull_request.labels.*.name, 'deploy')
        run: echo "DOCKER_REGISTRY=$REGISTRY/pr" >> $GITHUB_ENV

      - name: Set docker registry (deployment)
        if: "!contains(github.event.pull_request.labels.*.name, 'deploy')"
        run: echo "DOCKER_REGISTRY=$REGISTRY/develop" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Short sha
        id: sha
        run: |
          # set-output 구문은 사용 중지되었으므로 $GITHUB_OUTPUT 형식을 사용합니다.
          echo "sha_short=$(echo ${GITHUB_HEAD_SHA:0:7})" >> $GITHUB_OUTPUT
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ steps.sha.outputs.sha_short }}

      - name: Login to Harbor Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER_ID }}
          password: ${{ secrets.HARBOR_USER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
