name: github-actions/gradle/build
on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    # PR 댓글 삭제/작성 계열 액션에서 권한 이슈를 피하기 위해 명시
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    env:
      MIN_TEST_COVERAGE: 17
      ENVIRONMENT: dev
      REDIS_CLUSTER_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MYSQL_RO_HOSTNAME: localhost:3306
      MYSQL_RW_HOSTNAME: localhost:3306
      MYSQL_USERNAME: moomark
      MYSQL_PASSWORD: 1q2w3e4r
      MYSQL_DATABASE: moomark-post
      AUTH_SERVICE_HOST: ${{ secrets.AUTH_SERVICE_HOST }}

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379/tcp
      mysql:
        image: mysql:8.0.20
        ports:
          - 3306:3306/tcp
        env:
          MYSQL_DATABASE: moomark-post
          MYSQL_USER: moomark
          MYSQL_PASSWORD: 1q2w3e4r
          MYSQL_ROOT_PASSWORD: 1q2w3e4r
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Verify MySql connection
        env:
          PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"$PORT" --silent; do
            echo "Waiting for MySQL..."
            sleep 1
          done

      - name: Run build
        run: ./gradlew build -x checkstyleMain -x test -x checkstyleTest --stacktrace

      - name: Run test
        run: ./gradlew test -x checkstyleMain -x checkstyleTest --stacktrace

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: junit Tests
          path: build/test-results/test/**/*.xml
          reporter: java-junit

      # push 이벤트에는 github.event.number가 없어서 NaN 문제가 발생하므로,
      # PR일 때만 실행 + PR 번호를 명시적으로 사용합니다.
      - name: Delete existing comment
        uses: izhangzhihao/delete-comment@master
        if: always() && github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_user_name: github-actions[bot]
          issue_number: ${{ github.event.pull_request.number }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml

      - name: Add coverage to PR
        id: coverage
        uses: madrapps/jacoco-report@v1.7.1
        if: always()
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: ${{ env.MIN_TEST_COVERAGE }}

      - name: Coverage check logic
        if: always()
        run: |
          echo "Current Coverage: $RESULT_COVERAGE"
          echo "Min Coverage: $COVERAGE"
          if (( $(echo "$RESULT_COVERAGE < $COVERAGE" | bc -l) )); then
            echo "Coverage is too low!"
            exit 1
          fi
        env:
          COVERAGE: ${{ env.MIN_TEST_COVERAGE }}
          RESULT_COVERAGE: ${{ steps.coverage.outputs.coverage-overall }}
